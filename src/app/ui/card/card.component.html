<div class="card"
     [ngStyle]="{ 'top.px': positionY, 'left.px': positionX }"
     cdkDrag
     (cdkDragMoved)="onDrag($event)"
     (cdkDragEnded)="onDragEnd($event)"
     [@cardFlip]="cardState"
     (click)="flip()"
     (keypress)="flip()"
     tabindex="">
  <div class="face back">
    <img src="../../../assets/card-images/back.jpg" alt/>
  </div>
  <div class="face front">
    <img [src]="imagePath" alt="" />
  </div>
</div>
